<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập | Hệ thống quản lý phòng Gym</title>
  </head>
  <body>
    <main>
      <h1>Hệ thống quản lý phòng Gym</h1>
      <h2>Đăng nhập</h2>

      {% if form.errors %}
      <p>Tên đăng nhập hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.</p>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <p>
          <label for="{{ form.username.id_for_label }}"> Tên đăng nhập: </label>
          {{ form.username }}
        </p>

        <p>
          <label for="{{ form.password.id_for_label }}"> Mật khẩu: </label>
          {{ form.password }}
        </p>

        {% if next %}
        <input type="hidden" name="next" value="{{ next }}" />
        {% endif %}

        <button type="submit">Đăng nhập</button>
      </form>
    </main>
  </body>
</html>
